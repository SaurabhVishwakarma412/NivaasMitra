{% load static %}
{% comment %}Hero section for landing page {% endcomment %}
<section class="relative overflow-hidden rounded-2xl bg-gradient-to-r from-brand-500 to-brand-700 text-white py-20 px-6 sm:px-12 lg:px-20">
  <div class="max-w-4xl mx-auto text-center">
    <h1 class="text-4xl sm:text-5xl font-extrabold mb-4">Find Your Perfect Home</h1>
    <p class="text-lg mb-6">Explore houses, apartments, rooms and PGs. Book viewings or send your dates instantly.</p>
    <a href="{% url 'listings' %}" class="inline-block bg-white text-brand-700 font-semibold py-2 px-6 rounded-lg hover:bg-gray-100 transition">Browse Listings</a>
  </div>
  <img src="{% static 'rentals/hero-bg.jpg' %}" alt="Hero background" class="absolute inset-0 w-full h-full object-cover opacity-20 pointer-events-none"/>
</section>
