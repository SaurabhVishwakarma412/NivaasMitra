{% load static %}
{% comment %}Hero section for landing page {% endcomment %}
<section class="relative flex min-h-[600px] items-center justify-center overflow-hidden rounded-2xl bg-stone-100 px-6 py-20 sm:min-h-[520px] sm:px-12 lg:px-20">
  <img src="{% static 'rentals/hero1-bg.jpg' %}" alt="" aria-hidden="true" class="pointer-events-none absolute inset-0 h-full w-full object-cover object-center"/>
  <div aria-hidden="true" class="pointer-events-none absolute inset-0 bg-white/65"></div>
  <div class="relative z-10 mx-auto max-w-3xl text-center">
    <h1 class="mb-4 text-4xl font-extrabold text-stone-950 sm:text-5xl lg:text-6xl">Find Your Perfect Home</h1>
    <p class="mx-auto mb-4 max-w-2xl text-lg leading-relaxed text-stone-800 sm:text-xl">Explore houses, apartments, rooms and PGs. Book viewings or send your dates instantly.</p>
    <a href="{% url 'listings' %}" class="inline-block rounded-lg bg-brand-600 p-3 mb-4 font-bold text-white shadow-md transition hover:bg-brand-700">Browse Listings</a>
  </div>
</section>
