<form method="get"
      class="mb-6 grid gap-3 rounded-xl border border-stone-200 bg-white p-4 shadow-sm sm:grid-cols-2 lg:grid-cols-4">
  <label class="form-label" for="{{ search_form.q.id_for_label }}">
    Keyword
    {{ search_form.q }}
    {% for error in search_form.q.errors %}<span class="field-error">{{ error }}</span>{% endfor %}
  </label>
  <label class="form-label" for="{{ search_form.city.id_for_label }}">
    City
    {{ search_form.city }}
    {% for error in search_form.city.errors %}<span class="field-error">{{ error }}</span>{% endfor %}
  </label>
  <label class="form-label" for="{{ search_form.property_type.id_for_label }}">
    Type
    {{ search_form.property_type }}
  </label>
  <label class="form-label" for="{{ search_form.min_bedrooms.id_for_label }}">
    Bedrooms
    {{ search_form.min_bedrooms }}
  </label>
  <label class="form-label" for="{{ search_form.min_rent.id_for_label }}">
    Min rent (₹)
    {{ search_form.min_rent }}
    {% for error in search_form.min_rent.errors %}<span class="field-error">{{ error }}</span>{% endfor %}
  </label>
  <label class="form-label" for="{{ search_form.max_rent.id_for_label }}">
    Max rent (₹)
    {{ search_form.max_rent }}
    {% for error in search_form.max_rent.errors %}<span class="field-error">{{ error }}</span>{% endfor %}
  </label>
  <label class="form-label" for="{{ search_form.move_in_date.id_for_label }}">
    Move-in by
    {{ search_form.move_in_date }}
    {% for error in search_form.move_in_date.errors %}<span class="field-error">{{ error }}</span>{% endfor %}
  </label>
  <label class="form-label" for="{{ search_form.sort.id_for_label }}">
    Sort by
    {{ search_form.sort }}
  </label>
  <div class="flex items-end gap-2">
    <button class="btn-primary flex-1" type="submit">Apply filters</button>
    <a class="btn-secondary" href="{% url 'listings' %}">Reset</a>
  </div>
</form>
